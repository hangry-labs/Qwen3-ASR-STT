version: '3'

vars:
  IMAGE: qwen3-asr-stt:test
  TINY_IMAGE: qwen3-asr-stt:tiny
  PORT: '8000'
  GPU_DEVICE: '0'
  HF_TOKEN: ''
  HF_CACHE_VOLUME: qwen3_asr_stt_hf_cache
  TORCH_COMPILE_CACHE_VOLUME: qwen3_asr_stt_torch_compile_cache
  TORCH_COMPILE_CACHE_ROOT: /app/.cache/torchinductor
  VLLM_CACHE_VOLUME: qwen3_asr_stt_vllm_cache
  VLLM_CACHE_ROOT: /app/.cache/vllm
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  TRANSFORMERS_VERBOSITY: 'error'
  CONTAINER: qwen3_asr_stt
  CONTAINER_LOCAL: qwen3_asr_stt_local
  API_CONTAINER: qwen3_asr_stt_api
  ASR_MODEL: 'Qwen/Qwen3-ASR-0.6B-hf'
  ASR_BACKEND: 'vllm'
  ASR_06B_MODEL: 'Qwen/Qwen3-ASR-0.6B-hf'
  ASR_17B_MODEL: 'Qwen/Qwen3-ASR-1.7B-hf'
  PREFETCH_MODELS: 'Qwen/Qwen3-ASR-0.6B-hf,Qwen/Qwen3-ASR-1.7B-hf'
  PREFETCH_ALLOW_PATTERNS: ''
  PREFETCH_ALIGNER: '1'
  ALIGNER_MODEL: 'Qwen/Qwen3-ForcedAligner-0.6B-hf'
  ENABLE_ALIGNER: '0'
  ASR_CONCURRENCY: '2'
  GPU_MEMORY_UTILIZATION: '0.25'
  MAX_MODEL_LEN: '2048'
  MAX_NUM_BATCHED_TOKENS: '2048'
  MAX_NUM_SEQS: '2'
  VLLM_DTYPE: 'bfloat16'
  GENERATION_CONFIG: 'vllm'
  VLLM_RUNTIME_ENV: >-
    -e CUDA_HOME=/usr/local/lib/python3.13/site-packages/nvidia/cu13
    -e FLASHINFER_WORKSPACE_BASE={{.VLLM_CACHE_ROOT}}
    -e QWEN_ASR_BACKEND={{.ASR_BACKEND}}
    -e QWEN_ASR_GPU_MEMORY_UTILIZATION={{.GPU_MEMORY_UTILIZATION}}
    -e QWEN_ASR_MAX_MODEL_LEN={{.MAX_MODEL_LEN}}
    -e QWEN_ASR_MAX_NUM_BATCHED_TOKENS={{.MAX_NUM_BATCHED_TOKENS}}
    -e QWEN_ASR_MAX_NUM_SEQS={{.MAX_NUM_SEQS}}
    -e QWEN_ASR_VLLM_DTYPE={{.VLLM_DTYPE}}
    -e QWEN_ASR_GENERATION_CONFIG={{.GENERATION_CONFIG}}
  LOCAL_SOURCE_ENV: >-
    -e QWEN_ASR_UI_DEV=1
    -v "{{.TASKFILE_DIR}}\qwen_asr:/app/qwen_asr"
    -v "{{.TASKFILE_DIR}}\hangrylabs:/app/hangrylabs"
    -v "{{.TASKFILE_DIR}}\testbench:/app/testbench"
    -v "{{.TASKFILE_DIR}}\VERSION:/app/VERSION:ro"
  MAX_INFERENCE_BATCH_SIZE: '2'
  MAX_NEW_TOKENS: '512'
  TRANSFORMERS_DTYPE: 'bfloat16'
  TRANSFORMERS_DEVICE_MAP: 'cuda:0'
  TORCH_COMPILE: '1'
  TORCH_COMPILE_BACKEND: 'inductor'
  TORCH_COMPILE_MODE: 'default'
  TORCH_COMPILE_FULLGRAPH: '0'
  STARTUP_WARMUP: '1'
  STARTUP_WARMUP_TOKENS: '512'
  STARTUP_WARMUP_ITERATIONS: '3'
  TRACE_REQUESTS: '0'
  ALIGNER_KWARGS: ''
  TEMP_AUDIO: '%TEMP%\\qwen3_asr_stt_task_audio.wav'
  SAMPLE_AUDIO_URL: 'https://qianwen-res.oss-cn-beijing.aliyuncs.com/Qwen3-ASR-Repo/asr_en.wav'
  QUALITY_BASE_URL: 'http://127.0.0.1:8000'
  QUALITY_MODEL: 'qwen3-asr'
  QUALITY_MODEL_LABEL: 'Qwen/Qwen3-ASR-0.6B-hf'
  QUALITY_LIMIT: '0'
  QUALITY_PREWARM: '10'
  QUALITY_LANGUAGE: ''
  QUALITY_REQUEST_TIMEOUT: '240'
  BENCHMARK_COMMENT: ''
  HEALTH_TIMEOUT_SECONDS: '600'
  DRY_RUN: '0'
  NEXT_VERSION: ''
  SKIP_VALIDATION: '0'

tasks:
  list:
    desc: List available tasks
    cmds:
      - task --list

  gpuinfo:
    desc: Show host GPU indexes
    cmds:
      - cmd /c nvidia-smi --query-gpu=index,name,memory.total,memory.used --format=csv,noheader

  doctor:
    desc: Show local tool and interpreter status
    cmds:
      - cmd /c python --version
      - 'cmd /c ".venv\Scripts\python.exe" --version'
      - cmd /c docker --version
      - cmd /c docker compose version
      - cmd /c task --version
      - cmd /c git status --short

  release:
    desc: Validate, tag, and push the current release, then prepare the next snapshot
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/release.ps1 -DryRun "{{.DRY_RUN}}" -NextVersion "{{.NEXT_VERSION}}" -SkipValidation "{{.SKIP_VALIDATION}}"

  compile:
    desc: Compile Python sources
    cmds:
      - 'cmd /c ".venv\Scripts\python.exe" -m compileall -q qwen_asr testbench'

  codeql:
    desc: Run CodeQL Python security-and-quality analysis
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/run_codeql.ps1

  deps:
    desc: Regenerate Linux/Python 3.13 requirements.txt from requirements.in
    cmds:
      - uv pip compile requirements.in --python-version 3.13 --python-platform x86_64-manylinux_2_36 --index-strategy unsafe-best-match --upgrade --no-header --no-annotate --output-file requirements.txt

  image:
    desc: Build local baked Qwen3-ASR-STT Docker image
    cmds:
      - cmd /c docker build --target baked --build-arg QWEN_ASR_PREFETCH_MODELS={{.PREFETCH_MODELS}} --build-arg QWEN_ASR_PREFETCH_ALLOW_PATTERNS={{.PREFETCH_ALLOW_PATTERNS}} --build-arg QWEN_ASR_PREFETCH_ALIGNER={{.PREFETCH_ALIGNER}} -t {{.IMAGE}} .

  image-tiny:
    desc: Build local tiny Qwen3-ASR-STT Docker image without baked model cache
    cmds:
      - cmd /c docker build --target tiny -t {{.TINY_IMAGE}} .

  cache-volumes:
    desc: Create persistent Hugging Face, vLLM, and TorchInductor cache volumes
    cmds:
      - cmd /c docker volume create {{.HF_CACHE_VOLUME}} >nul
      - cmd /c docker volume create {{.TORCH_COMPILE_CACHE_VOLUME}} >nul
      - cmd /c docker volume create {{.VLLM_CACHE_VOLUME}} >nul

  cache-init:
    desc: Seed persistent Hugging Face cache volume from the baked image
    cmds:
      - task cache-volumes
      - cmd /c docker run --rm --entrypoint sh -v {{.HF_CACHE_VOLUME}}:/hf-cache -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.IMAGE}} -c "test -d /app/.cache/huggingface/hub && mkdir -p /hf-cache && cp -an /app/.cache/huggingface/. /hf-cache/"

  model-choices:
    desc: Show supported Qwen3-ASR Hugging Face models
    cmds:
      - cmd /c echo {{.ASR_17B_MODEL}}
      - cmd /c echo {{.ASR_06B_MODEL}}

  cache-pull-models:
    desc: Online fallback; pull configured model assets into the persistent Hugging Face cache volume
    cmds:
      - task cache-volumes
      - cmd /c docker run --rm -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -e HF_TOKEN={{.HF_TOKEN}} -e QWEN_ASR_PREFETCH_MODELS={{.PREFETCH_MODELS}} -e QWEN_ASR_PREFETCH_ALLOW_PATTERNS={{.PREFETCH_ALLOW_PATTERNS}} -e QWEN_ASR_PREFETCH_ALIGNER={{.PREFETCH_ALIGNER}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} -v "{{.TASKFILE_DIR}}\qwen_asr:/app/qwen_asr" {{.IMAGE}} python -u -m qwen_asr.prefetch_assets

  imagerun:
    desc: Run baked image with the browser UI and API on PORT, plus persistent caches
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker rm -f {{.API_CONTAINER}} >nul 2>&1
      - task cache-init
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY={{.ASR_CONCURRENCY}} -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE={{.MAX_INFERENCE_BATCH_SIZE}} -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  imagerun-tiny:
    desc: Run tiny image online on first use, using persistent model/compile caches
    cmds:
      - cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
      - cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
      - cmd /c docker rm -f {{.API_CONTAINER}} >nul 2>&1
      - task cache-volumes
      - cmd /c docker run -d --name {{.CONTAINER}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY={{.ASR_CONCURRENCY}} -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE={{.MAX_INFERENCE_BATCH_SIZE}} -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.TINY_IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER}}
      - cmd /c docker ps --filter "name={{.CONTAINER}}"

  localrun:
    desc: Run baked image with local qwen_asr/ bind-mounted for hot-swapping package code
    cmds:
      - cmd: cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - task cache-init
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY={{.ASR_CONCURRENCY}} -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE={{.MAX_INFERENCE_BATCH_SIZE}} -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.LOCAL_SOURCE_ENV}} {{.IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER_LOCAL}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  localrun-tiny:
    desc: Run tiny image with local qwen_asr/ bind-mounted, online on first use
    cmds:
      - cmd: cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - task cache-volumes
      - cmd /c docker run -d --name {{.CONTAINER_LOCAL}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE=0 -e TRANSFORMERS_OFFLINE=0 -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY={{.ASR_CONCURRENCY}} -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE={{.MAX_INFERENCE_BATCH_SIZE}} -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.LOCAL_SOURCE_ENV}} {{.TINY_IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.CONTAINER_LOCAL}}
      - cmd /c docker ps --filter "name={{.CONTAINER_LOCAL}}"

  imageweb:
    desc: Open the primary browser UI
    cmds:
      - cmd /c start "" "http://localhost:{{.PORT}}"

  imageapi:
    desc: Download upstream sample audio for manual UI/API smoke checks
    cmds:
      - 'cmd /c curl.exe -L -sS "{{.SAMPLE_AUDIO_URL}}" --output {{.TEMP_AUDIO}}'
      - 'cmd /c if not exist {{.TEMP_AUDIO}} exit /b 1'
      - 'cmd /c python -c "from pathlib import Path; p=Path(r''{{.TEMP_AUDIO}}''); assert p.exists() and p.stat().st_size > 0, p; print(p)"'

  quality-smoke:
    desc: Run a small OpenAI-compatible transcription quality smoke test against the running API
    cmds:
      - 'cmd /c python "testbench\run_openai_quality.py" --base-url {{.QUALITY_BASE_URL}} --model {{.QUALITY_MODEL}} --model-label "{{.QUALITY_MODEL_LABEL}}" --limit 2 --request-timeout {{.QUALITY_REQUEST_TIMEOUT}} --no-append'

  benchmark-transcription:
    desc: Run transcription quality benchmark and append markdown summaries
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/wait_openai_health.ps1 -BaseUrl {{.QUALITY_BASE_URL}} -ExpectedModel "{{.QUALITY_MODEL_LABEL}}" -TimeoutSeconds {{.HEALTH_TIMEOUT_SECONDS}}
      - 'cmd /c python "testbench\run_openai_quality.py" --base-url {{.QUALITY_BASE_URL}} --model {{.QUALITY_MODEL}} --model-label "{{.QUALITY_MODEL_LABEL}}" --limit {{.QUALITY_LIMIT}} --prewarm {{.QUALITY_PREWARM}} --request-timeout {{.QUALITY_REQUEST_TIMEOUT}} --language "{{.QUALITY_LANGUAGE}}" --comment "{{.BENCHMARK_COMMENT}}"'

  deploy-api-06b:
    desc: Start full UI/API service with Qwen3-ASR 0.6B and wait for health
    cmds:
      - cmd: cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.API_CONTAINER}} >nul 2>&1
        ignore_error: true
      - task cache-init
      - cmd /c docker run -d --name {{.API_CONTAINER}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_06B_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY=2 -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE=2 -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.API_CONTAINER}}
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/wait_openai_health.ps1 -BaseUrl http://127.0.0.1:{{.PORT}} -ExpectedModel "{{.ASR_06B_MODEL}}" -Container {{.API_CONTAINER}} -TimeoutSeconds {{.HEALTH_TIMEOUT_SECONDS}}

  deploy-api-17b:
    desc: Start full UI/API service with Qwen3-ASR 1.7B and wait for health
    cmds:
      - cmd: cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.API_CONTAINER}} >nul 2>&1
        ignore_error: true
      - task cache-init
      - cmd /c docker run -d --name {{.API_CONTAINER}} -p {{.PORT}}:8000 --gpus all {{.VLLM_RUNTIME_ENV}} -e CUDA_VISIBLE_DEVICES={{.GPU_DEVICE}} -e CUDA_DEVICE_ORDER=PCI_BUS_ID -e PORT=8000 -e HF_TOKEN={{.HF_TOKEN}} -e HF_HUB_OFFLINE={{.HF_HUB_OFFLINE}} -e TRANSFORMERS_OFFLINE={{.TRANSFORMERS_OFFLINE}} -e TRANSFORMERS_VERBOSITY={{.TRANSFORMERS_VERBOSITY}} -e QWEN_ASR_MODEL={{.ASR_17B_MODEL}} -e QWEN_ASR_ALIGNER_MODEL={{.ALIGNER_MODEL}} -e QWEN_ASR_ENABLE_ALIGNER={{.ENABLE_ALIGNER}} -e QWEN_ASR_CONCURRENCY=2 -e QWEN_ASR_MAX_INFERENCE_BATCH_SIZE=2 -e QWEN_ASR_MAX_NEW_TOKENS={{.MAX_NEW_TOKENS}} -e QWEN_ASR_TRANSFORMERS_DTYPE={{.TRANSFORMERS_DTYPE}} -e QWEN_ASR_TRANSFORMERS_DEVICE_MAP={{.TRANSFORMERS_DEVICE_MAP}} -e QWEN_ASR_TORCH_COMPILE={{.TORCH_COMPILE}} -e QWEN_ASR_TORCH_COMPILE_BACKEND={{.TORCH_COMPILE_BACKEND}} -e QWEN_ASR_TORCH_COMPILE_MODE={{.TORCH_COMPILE_MODE}} -e QWEN_ASR_TORCH_COMPILE_FULLGRAPH={{.TORCH_COMPILE_FULLGRAPH}} -e QWEN_ASR_STARTUP_WARMUP={{.STARTUP_WARMUP}} -e QWEN_ASR_STARTUP_WARMUP_TOKENS={{.STARTUP_WARMUP_TOKENS}} -e QWEN_ASR_STARTUP_WARMUP_ITERATIONS={{.STARTUP_WARMUP_ITERATIONS}} -e QWEN_ASR_TRACE_REQUESTS={{.TRACE_REQUESTS}} -v {{.HF_CACHE_VOLUME}}:/app/.cache/huggingface -v {{.TORCH_COMPILE_CACHE_VOLUME}}:{{.TORCH_COMPILE_CACHE_ROOT}} -v {{.VLLM_CACHE_VOLUME}}:{{.VLLM_CACHE_ROOT}} {{.IMAGE}}
      - cmd /c docker update --restart unless-stopped {{.API_CONTAINER}}
      - powershell -NoProfile -ExecutionPolicy Bypass -File scripts/wait_openai_health.ps1 -BaseUrl http://127.0.0.1:{{.PORT}} -ExpectedModel "{{.ASR_17B_MODEL}}" -Container {{.API_CONTAINER}} -TimeoutSeconds {{.HEALTH_TIMEOUT_SECONDS}}

  benchmark-transcription-06b:
    desc: Deploy 0.6B full UI/API service, wait for health, then run official transcription benchmark
    cmds:
      - task deploy-api-06b
      - 'cmd /c python "testbench\run_openai_quality.py" --base-url http://127.0.0.1:8000 --model qwen3-asr --model-label "Qwen/Qwen3-ASR-0.6B-hf" --limit {{.QUALITY_LIMIT}} --prewarm {{.QUALITY_PREWARM}} --request-timeout {{.QUALITY_REQUEST_TIMEOUT}} --language "{{.QUALITY_LANGUAGE}}" --comment "{{.BENCHMARK_COMMENT}}"'

  benchmark-transcription-17b:
    desc: Deploy 1.7B full UI/API service, wait for health, then run official transcription benchmark
    cmds:
      - task deploy-api-17b
      - 'cmd /c python "testbench\run_openai_quality.py" --base-url http://127.0.0.1:8000 --model qwen3-asr --model-label "Qwen/Qwen3-ASR-1.7B-hf" --limit {{.QUALITY_LIMIT}} --prewarm {{.QUALITY_PREWARM}} --request-timeout {{.QUALITY_REQUEST_TIMEOUT}} --language "{{.QUALITY_LANGUAGE}}" --comment "{{.BENCHMARK_COMMENT}}"'

  imagestop:
    desc: Stop running Qwen3-ASR-STT containers
    cmds:
      - cmd: cmd /c docker stop {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker stop {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker stop {{.API_CONTAINER}} >nul 2>&1
        ignore_error: true

  logs:
    desc: Show logs from active Qwen3-ASR-STT container
    cmds:
      - cmd /c docker logs --tail 200 {{.API_CONTAINER}} 2>nul || docker logs --tail 200 {{.CONTAINER_LOCAL}} 2>nul || docker logs --tail 200 {{.CONTAINER}}

  nuke:
    desc: Remove Qwen3-ASR-STT local containers, images, and cache volumes
    cmds:
      - cmd: cmd /c docker rm -f {{.CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.CONTAINER_LOCAL}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rm -f {{.API_CONTAINER}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rmi -f {{.IMAGE}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker rmi -f {{.TINY_IMAGE}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker volume rm -f {{.HF_CACHE_VOLUME}} >nul 2>&1
        ignore_error: true
      - cmd: cmd /c docker volume rm -f {{.TORCH_COMPILE_CACHE_VOLUME}} >nul 2>&1
        ignore_error: true
