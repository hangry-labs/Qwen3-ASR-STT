[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-asr"
version = "0.2.0.dev0"
description = "Hangry Labs Docker-first runtime packaging for Qwen3-ASR speech-to-text"
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]
maintainers = [{ name = "Hangry Labs" }]

dependencies = [
  "torch==2.9.1",
  "torchaudio==2.9.1",
  "transformers==4.57.6",
  "nagisa==0.2.11",
  "soynlp==0.0.493",
  "accelerate==1.12.0",
  "qwen-omni-utils==0.0.9",
  "librosa==0.11.0",
  "soundfile==0.13.1",
  "sox==1.5.0",
  "gradio==6.14.0",
  "fastapi==0.124.2",
  "uvicorn==0.38.0",
  "python-multipart==0.0.20",
  "flask==3.1.2",
  "pytz==2025.2",
  "numpy==2.2.6",
  "scipy==1.16.3",
  "huggingface-hub==0.36.0",
  "torch-c-dlpack-ext==0.1.5",
]

[project.optional-dependencies]
vllm = [
  "vllm==0.14.0",
]

[project.urls]
Homepage = "https://github.com/hangry-labs/Qwen3-ASR-STT"
Repository = "https://github.com/hangry-labs/Qwen3-ASR-STT"
"Upstream Project" = "https://github.com/QwenLM/Qwen3-ASR"

[project.entry-points."vllm.general_plugins"]
qwen_asr = "qwen_asr.vllm_plugin:register"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_asr*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_asr = ["py.typed", "**/*.dict"]
