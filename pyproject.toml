[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qwen-asr"
version = "0.2.0.dev0"
description = "Hangry Labs Docker-first runtime packaging for Qwen3-ASR speech-to-text"
readme = "README.md"
requires-python = ">=3.13,<3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
]
license = { text = "Apache-2.0" }
authors = [{ name = "Alibaba Qwen Team" }]
maintainers = [{ name = "Hangry Labs" }]

dependencies = [
  "torch==2.11.0",
  "torchaudio==2.11.0",
  "torchvision==0.26.0",
  "nvidia-cuda-nvcc==13.0.88; platform_system == 'Linux'",
  "nvidia-cuda-crt==13.0.88; platform_system == 'Linux'",
  "nvidia-nvvm==13.0.88; platform_system == 'Linux'",
  "transformers==5.14.1",
  "vllm[audio]==0.26.0",
  "accelerate==1.14.0",
  "qwen-omni-utils==0.0.9",
  "librosa==0.11.0",
  "soundfile==0.13.1",
  "sox==1.5.0",
  "fastapi==0.136.3",
  "uvicorn==0.51.0",
  "python-multipart==0.0.32",
  "flask==3.1.2",
  "pytz==2025.2",
  "numpy==2.2.6",
  "scipy==1.18.1",
  "huggingface-hub==1.5.0",
]

[project.urls]
Homepage = "https://github.com/hangry-labs/Qwen3-ASR-STT"
Repository = "https://github.com/hangry-labs/Qwen3-ASR-STT"
"Upstream Project" = "https://github.com/QwenLM/Qwen3-ASR"

[tool.setuptools]
packages = { find = { where = ["."] , include = ["qwen_asr*"] } }
include-package-data = true

[tool.setuptools.package-data]
qwen_asr = ["py.typed", "**/*.dict", "standalone_ui/static/**/*"]
